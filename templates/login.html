<!DOCTYPE html>
<html>

<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center h-screen bg-gray-100">

    <form method="POST" class="bg-white p-8 shadow-lg rounded w-96">
        <h1 class="text-xl font-bold mb-4 text-center">Login</h1>

        <input type="email" name="email" class="w-full border p-2 rounded mb-3" placeholder="Email" />
        <input type="password" name="password" class="w-full border p-2 rounded mb-3" placeholder="Password" />

        <button class="w-full bg-blue-600 text-white p-2 rounded">Login</button>
    </form>

</body>

</html>
