<!DOCTYPE html>
<html>

<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="p-10 bg-gray-100">

    <h1 class="text-3xl font-bold mb-4">Upload File</h1>

    <form method="POST" enctype="multipart/form-data" class="bg-white p-6 rounded shadow w-96">
        <input type="file" name="file" class="border p-2 w-full mb-4 rounded">
        <button class="bg-blue-600 text-white py-2 px-4 rounded w-full">
            Upload
        </button>
    </form>

</body>

</html>
